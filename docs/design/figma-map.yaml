  design_baseline_width: 375
  access_note: "URL is an index only. Live inspection still requires Figma MCP/connector permissions in the local agent environment."

rules:
  - "Never guess a node by visual similarity."
  - "Use exact node_id from this map when live Figma tooling is available."
  - "Read shared_component_doc before implementing page-local equivalents."
  - "If live Figma is unavailable, use design_doc plus local visual baseline and explicitly report the limitation."
  - "Do not commit temporary Figma MCP asset URLs into production code."

